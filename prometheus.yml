global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'spotify-mlops-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mlops-app:8005']
        labels:
          environment: 'docker'
          service: 'spotify-mlops'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
